[package]
name = "datacraft"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/javy-fernandez/datacraft"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
# GPU: solo Metal + WGSL (sin Vulkan/GLES/DX12/WebGPU), que es lo único que usa macOS.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu_no_default_features", "persistence"] }
egui-wgpu = { version = "0.36", default-features = false }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }
egui = "0.36"
egui_extras = "0.36"
futures-util = "0.3.34"
keyring = { version = "3", features = ["apple-native"] }
rfd = "0.17.2"
# SQLite del sistema (/usr/lib/libsqlite3) en vez de compilarlo dentro del binario.
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# TLS con rustls: el TLS nativo de macOS (Security.framework) no negocia con SQL Server.
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "rustls", "chrono"] }
# MySQL / MariaDB: pure Rust, rustls with the same aws-lc provider as tiberius.
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls"] }
# Oracle: ODPI-C, loads the Oracle Instant Client at runtime (not needed to build).
oracle = "0.6.3"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-postgres = "0.7.18"
tokio-util = { version = "0.7.20", features = ["compat"] }
muda = { version = "0.21.2", default-features = false }
sys-locale = "0.3.2"

# Windows: DirectX 12 for the GPU, the Credential Manager for passwords and a bundled SQLite
# (there is no system libsqlite3 to link against).
[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
keyring = { version = "3", features = ["windows-native"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
